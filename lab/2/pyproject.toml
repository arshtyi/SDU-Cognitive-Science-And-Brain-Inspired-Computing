[project]
name = "lab2"
version = "0.1.0"
authors = [
    { name = "arshtyi", email = "arshtyi@foxmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ty.src]
include = [
    "main.py",
]
